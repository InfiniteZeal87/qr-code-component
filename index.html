<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      p {
        font-size: 10x;
        color: gray;
      }
      .qr {
        width: 100%;
        height: auto;
        border-radius: 10px;
      }
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div
      class="background"
      style="
        background-color: rgb(156, 156, 186);
        width: 800px;
        height: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        class="projects"
        style="
          background-color: white;
          border-radius: 10px;
          width: 250px;
          height: 350px;
        "
      >
        <div
          class="border"
          style="
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 16px;
            padding-top: 16px;
            text-align: center;
          "
        >
          <img class="qr" src="./images/image-qr-code.png" />
          <strong>Improve your front-end skills by building projects</strong>
          <p>
            Scan the qr-code to visit Frontend Mentor and take your coding
            skills to the next level
          </p>
        </div>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Nosi Mama</a>.
    </div>
  </body>
</html>
